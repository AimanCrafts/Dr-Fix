name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  DEPLOY_USER: s20230204105
  DEPLOY_HOST: 187.52.122.100

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Use PHP 8.4, same as the server
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install PHP packages (Composer)
        working-directory: packages/Backend
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the React app
        working-directory: packages/Frontend
        run: |
          npm ci
          npm run build
          test -f ../Backend/public/app/index.html

      - name: Pack the release
        run: |
          tar -czf release.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.*' \
            -C packages/Backend .

      - name: Load the deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Copy the release with scp
        run: |
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            release.tar.gz ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:~/release.tar.gz

      - name: Unpack, migrate and optimize on the server
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} 'bash -s' << 'REMOTE'
          set -e
          mkdir -p ~/laravel
          tar -xzf ~/release.tar.gz -C ~/laravel
          cd ~/laravel
          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          chmod -R u+rwX storage bootstrap/cache
          setfacl -R -m u:www-data:rX -m d:u:www-data:rX ~/laravel/public
          php artisan migrate --force
          php artisan optimize
          rm -f ~/release.tar.gz
          REMOTE
